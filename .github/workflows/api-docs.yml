---
name: API Docs
env:
  DEFAULT_KHIOPS_PYTHON_TUTORIAL_REVISION: 11.0.0.0
  DEFAULT_KHIOPS_SAMPLES_REVISION: 11.0.0
  # Never use system-level Python
  UV_PYTHON_PREFERENCE: only-managed
on:
  workflow_dispatch:
    inputs:
      khiops-python-tutorial-revision:
        default: 11.0.0.0
        description: khiops-python-tutorial repo revision
      khiops-samples-revision:
        default: 11.0.0
        description: khiops-samples repo revision
  pull_request:
    paths:
      - doc/site/**.md
      - doc/util/create-doc
      - doc/util/clean-doc
      - doc/util/*.py
      - zensical.toml
      - khiops/**.py
      - .github/workflows/api-docs.yml
      - pyproject.toml
      - doc/util/requirements.txt
      - scripts/extract_dependencies_from_pyproject_toml.py
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout khiops-python
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          version: 0.13.5
          python-version: '3.14'
      - name: Create the virtual environment
        run: |
          uv venv
          # The virtual environment is never activated: `uv` and `uv run
          # --active` use VIRTUAL_ENV, and its `bin` directory is added to the
          # PATH of the steps that need it
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
      - name: Install doc build requirements
        env:
          KHIOPS_SAMPLES_REVISION: ${{ inputs.khiops-samples-revision || env.DEFAULT_KHIOPS_SAMPLES_REVISION }}
        run: |
          # Make the virtual environment executables available in this step
          export PATH="$VIRTUAL_ENV/bin:$PATH"
          # Install package itself to install the samples datasets
          # First, install all dependencies except khiops-core and khiops-drivers-*
          python scripts/extract_dependencies_from_pyproject_toml.py -f "pyproject.toml" --exclude-khiops-family > requires-no-khiops.txt
          uv pip install `cat requires-no-khiops.txt`
          # khiops-core and khiops-drivers-* must always be installed from TestPyPI in order to avoid distorting usage statistics
          python scripts/extract_dependencies_from_pyproject_toml.py -f "pyproject.toml" --khiops-family-only > requires-khiops.txt
          uv pip install --index-url https://test.pypi.org/simple `cat requires-khiops.txt`
          rm -f requires-khiops.txt requires-no-khiops.txt
          # Lastly, install khiops-python
          uv pip install .
          kh-download-datasets --force-overwrite --version "${KHIOPS_SAMPLES_REVISION}"

          # Discard error as this is expected (Uv is not yet officially
          # supported by khiops, but this should pose no issue in practice)
          # TODO: Revert as soon as issue
          # https://github.com/KhiopsML/khiops-python/issues/602 is tackled
          kh-status || true

          # Install the doc python requirements
          uv pip install -U -r doc/util/requirements.txt
      # Clone the Khiops Python tutorial repository while building the documentation
      - name: Build Zensical Documentation
        env:
          KHIOPS_PYTHON_TUTORIAL_REVISION: ${{ inputs.khiops-python-tutorial-revision || env.DEFAULT_KHIOPS_PYTHON_TUTORIAL_REVISION }}
        run: doc/util/create-doc -t -d -g "${KHIOPS_PYTHON_TUTORIAL_REVISION}"
      - name: Upload the docs as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: ./doc/build/html/
